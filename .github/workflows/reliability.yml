name: Reliability

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet-fault-injection:
    name: Fleet fault injection
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dispatcher runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Run deterministic Fleet fault injection
        run: ./tests/reliability/run.sh
