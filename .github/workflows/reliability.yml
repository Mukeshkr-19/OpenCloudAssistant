name: Reliability

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-reliability:
    name: Deterministic reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Reliability dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-yaml rsync

      - name: P9 sandbox host preparation
        run: |
          sudo apt-get install -y bubblewrap apparmor apparmor-profiles

          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1" ]; then
              PROFILE_SOURCE=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
              PROFILE_TARGET=/etc/apparmor.d/bwrap-userns-restrict

              if [ -f "$PROFILE_SOURCE" ]; then
                  sudo install -m 0644 "$PROFILE_SOURCE" "$PROFILE_TARGET"
                  sudo apparmor_parser -r "$PROFILE_TARGET"
              fi
          fi

          bwrap --version
      - name: Checkout captured Hermes baseline
        uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: 3fa318a50c02df8dbd2c55499f5f73d51ad77188
          path: .hermes-baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Verify captured Hermes baseline
        env:
          hermes_commit: 3fa318a50c02df8dbd2c55499f5f73d51ad77188
        run: |
          set -euo pipefail
          docs_commit="$(sed -n "s/^Hermes Git HEAD: //p" docs/COMPATIBILITY.md)"
          test -n "$docs_commit"
          if [ "$docs_commit" != "$hermes_commit" ]; then
            printf 'ERROR: docs/COMPATIBILITY.md pins %s but workflow pins %s\n' \
              "$docs_commit" "$hermes_commit" >&2
            exit 1
          fi
          hermes_root="$GITHUB_WORKSPACE/.hermes-baseline"
          actual_commit="$(git -C "$hermes_root" rev-parse HEAD)"
          if [ "$actual_commit" != "$hermes_commit" ]; then
            printf 'ERROR: checked out %s but pinned baseline is %s\n' \
              "$actual_commit" "$hermes_commit" >&2
            exit 1
          fi

          echo "HERMES_ROOT=$hermes_root" >> "$GITHUB_ENV"

      - name: Install captured Hermes adapter dependency
        run: |
          set -euo pipefail

          python3 -m venv --system-site-packages "$RUNNER_TEMP/reliability-venv"
          reliability_python="$RUNNER_TEMP/reliability-venv/bin/python"
          hermes_httpx="$("$reliability_python" -c 'import sys,tomllib; dependencies=tomllib.load(open(sys.argv[1],"rb"))["project"]["dependencies"]; matches=[item for item in dependencies if item.lower().startswith(("httpx==","httpx["))]; assert len(matches)==1 and "==" in matches[0], "captured Hermes must exactly pin httpx"; print(matches[0])' "$HERMES_ROOT/pyproject.toml")"
          "$reliability_python" -m pip install "$hermes_httpx"
          "$reliability_python" -c 'import importlib.metadata,sys; expected=sys.argv[1].split("==",1)[1].split(";",1)[0].strip(); assert importlib.metadata.version("httpx")==expected' "$hermes_httpx"
          echo "OPEN_CLOUD_HERMES_PYTHON=$reliability_python" >> "$GITHUB_ENV"

      - name: Apply validated OpenCloud Hermes integration
        run: |
          OPEN_CLOUD_HERMES_ROOT="$HERMES_ROOT"             ./install/35-hermes-live.sh --install

      - name: Run deterministic reliability suite
        run: |
          OPEN_CLOUD_HERMES_ROOT="$HERMES_ROOT"             ./tests/reliability/run.sh
