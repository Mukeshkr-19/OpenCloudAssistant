name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Public privacy and credential audit
        run: ./scripts/public-audit.sh

      - name: Bash syntax
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            if [ -f "$file" ] && head -1 "$file" | grep -qE "^#!.*(bash|sh)"; then
              echo "bash -n $file"
              bash -n "$file"
            fi
          done < <(git ls-files)

      - name: Python compile
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files "*.py")

          if [ "${#files[@]}" -gt 0 ]; then
            echo "python compile: ${#files[@]} files"
            python3 -m py_compile "${files[@]}"
          fi

      - name: JSON validation
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            echo "json: $file"
            python3 -m json.tool "$file" >/dev/null
          done < <(git ls-files "*.json")

  smoke:
    name: Smoke / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Runner identity
        run: |
          uname -m
          . /etc/os-release
          echo "$PRETTY_NAME"

      - name: Smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: P9 sandbox packages
        run: |
          sudo apt-get install -y bubblewrap apparmor apparmor-profiles
      - name: Repository smoke suite
        run: ./tests/smoke/run.sh

  installer:
    name: Installer dry-run / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Runner identity
        run: |
          uname -m
          . /etc/os-release
          echo "$PRETTY_NAME"

      - name: Installer dry-run from clean home
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          HOME="$test_home" ./setup.sh --dry-run

  compatibility:
    name: Hermes compatibility / captured baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch captured Hermes baseline
        run: |
          set -euo pipefail
          hermes_commit="$(sed -n "s/^Hermes Git HEAD: //p" docs/COMPATIBILITY.md)"
          test -n "$hermes_commit"
          hermes_root="$RUNNER_TEMP/hermes-agent"
          git init -q "$hermes_root"
          git -C "$hermes_root" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$hermes_root" fetch --depth=1 origin "$hermes_commit"
          git -C "$hermes_root" checkout -q --detach FETCH_HEAD
          echo "HERMES_ROOT=$hermes_root" >> "$GITHUB_ENV"

      - name: Materialization compatibility
        run: OPEN_CLOUD_HERMES_ROOT="$HERMES_ROOT" ./tests/smoke/materialization.sh

      - name: Hermes live integration compatibility
        run: OPEN_CLOUD_HERMES_ROOT="$HERMES_ROOT" ./tests/smoke/hermes-live.sh
